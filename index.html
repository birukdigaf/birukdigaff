<script>
var S={customers:[],loans:[]},V={page:'dash',loan:null,pay:null,rc:null,q:''},KEY='digaf_loans_v1',PK='digaf_pw_v1',authed=false;

function sv(){}

function lno(L){return L.no||('DG-'+L.id.slice(-4).toUpperCase())}

async function hash(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){return btoa(s)}}

/* Digaf rules: due dates chain one month at a time (Jan 29 -> Mar 1 -> Apr 1), 0.2%/day penalty per overdue installment,
   payments applied penalty -> interest -> principal, oldest installment first. */
/* Finance SOP v4 (Digaf): each payment pays one monthly installment.
   late days = MAX(0, day of the payment - due day), where the due day is the day of the month of disbursement (the 10th in the manual);
   interest days = days in the payment month + late days; interest = balance before the payment x rate / 365 x interest days;
   penalty = monthly payment x 0.2% x late days; principal = payment - interest - penalty.
   A second payment in a month whose installment is already paid goes fully to principal. A payment of two or more monthly payments settles each month.
   Outstanding today = principal + interest accrued since the last payment + penalty on overdue installments. */
function calc(L,asOf){
 var P=+L.principal,r=L.rate/1200,R=L.rate/100,n=+L.n,pm=r?P*r/(1-Math.pow(1+r,-n)):P/n,pb=+L.pm0>0?+L.pm0:pm,dueDay=pd(L.start).getDate(),I=[],D=[],d=pd(L.start),B=P,bl=P,carryI=0,carryP=0,inst=0,lastMonth=null,last=pd(L.start),j,k,q;
 for(j=1;j<=n;j++){d=new Date(d);d.setMonth(d.getMonth()+1);D.push(d)}
 for(k=1;k<=n;k++){var it=bl*r,pr=k==n?bl:pm-it;bl-=pr;I.push({k:k,due:D[k-1],int:it,pr:pr,amt:it+pr,bal:Math.max(0,bl),pi:0,pp:0,pen:0,pp2:0,idays:0,pdays:0,st:''})}
 var ps=(L.payments||[]).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}),res={},ev=[],paid=0;
 ps.forEach(function(p){var t=pd(p.date),amt=+p.amt;paid+=amt;var key=t.getFullYear()*12+t.getMonth(),endM=new Date(t.getFullYear(),t.getMonth()+1,0),
  regular=inst<n&&(D[inst]<=endM||key!==lastMonth),e={id:p.id,date:p.date,amt:amt,base:B,k:regular?inst+1:0,kind:regular?'regular':'extra',days:0,mdays:0,late:0,carryIn:carryI},intC=0,penC=0,exp=amt,cover=0,pen0=0;
  if(regular){var late=p.late!=null?+p.late:Math.max(0,t.getDate()-dueDay),md=endM.getDate();cover=Math.min(n-inst,Math.max(1,Math.floor(amt/pb+1e-9)));
   intC=B>0.005?B*R/365*(md+late):0;pen0=pb*0.002*late;penC=pen0;for(q=1;q<cover;q++)penC+=pb*0.002*Math.max(0,dd(D[inst+q],t));
   exp=cover*pb+penC;e.days=md+late;e.mdays=md;e.late=late}
  var intDue=intC+carryI,penDue=penC+carryP,rem=amt,payPen=Math.min(rem,penDue);rem-=payPen;
  var payInt=Math.min(rem,intDue);rem-=payInt;var payPri=Math.min(rem,B);rem-=payPri;
  carryP=penDue-payPen;carryI=intDue-payInt;B-=payPri;
  if(regular){for(q=0;q<cover;q++){var ii=I[inst+q],pq=q?pb*0.002*Math.max(0,dd(D[inst+q],t)):pen0;ii.pen=pq;ii.pp2=penDue>0?pq*payPen/penDue:0;ii.pp=q?ii.amt:Math.min(ii.amt,amt-payPen);ii.pdays=q?Math.max(0,dd(D[inst+q],t)):e.late;if(!q){ii.int=intC;ii.pr=payPri;ii.idays=e.days}}inst+=cover;lastMonth=key}
  e.intAcc=intC;e.penAcc=penC;e.payInt=payInt;e.payPen=payPen;e.payPri=payPri;e.extra=rem;e.bal=B;ev.push(e);last=t;
  var df=amt-exp;res[p.id]={exp:exp,df:df,pen:payPen,int:payInt,pri:payPri,st:Math.abs(df)<0.01?'Exact':df<0?'Underpaid':'Overpaid'}});
 var ao=pd(asOf),accDays=Math.max(0,dd(last,ao)),accI=B>0.005?B*R/365*accDays:0,penAccr=0;
 if(B>0.005)for(k=inst;k<n;k++){var i2=I[k];if(i2.due<ao){var lt2=dd(i2.due,ao);i2.pdays=lt2;i2.pen=pb*0.002*lt2;penAccr+=i2.pen}}
 var s={prin:B,int:carryI+accI,pen:carryP+penAccr,paid:paid,od:0,odDays:0,odAmt:0,accI:accI,accDays:accDays,accBase:B,carry:carryI};
 s.total=s.prin+s.int+s.pen;s.pm=pm;s.closed=s.total<0.01;
 I.forEach(function(i,ix){i.st=s.closed||ix<inst?'Paid':i.due<ao?'Overdue':'Upcoming';if(i.st=='Overdue'){s.od++;s.odAmt+=i.amt;s.odDays=Math.max(s.odDays,dd(i.due,ao))}});
 s.nextDue=(I.find(function(i){return i.st!='Paid'})||{}).due;return{I:I,s:s,res:res,ev:ev}}

/* ---- FTD calculator (Digaf method): net monthly = P x rate/12 x 90%; interest-on-interest 0.9% net monthly on accumulated net fixed interest from month 2 (only when interest is paid at the end) ---- */
function ftdCalc(P,rate,n,mode){var net=P*rate/1200*0.9,gross=P*rate/1200,acc=0,fix=0,ioiT=0,rows=[],cum=0;
 for(var m=1;m<=n;m++){var ioi=(mode=='end'&&m>1)?acc*0.009:0;acc+=net;fix+=net;ioiT+=ioi;cum+=net+ioi;rows.push({m:m,gross:gross,tax:gross-net,net:net,ioi:ioi,tot:net+ioi,cum:cum})}
 return{rows:rows,gross:gross,net:net,fix:fix,ioi:ioiT,totI:fix+ioiT,mat:mode=='end'?P+fix+ioiT:P}}
function g(id){return document.getElementById(id)}
function ftdRates(){try{var r=JSON.parse(localStorage.getItem('digaf_ftd_rates')||'null');if(r&&r.length==3)return r}catch(e){}return[24,22,20]}
function ftdSave(){try{localStorage.setItem('digaf_ftd_rates',JSON.stringify([0,1,2].map(function(i){return+g('fr'+i).value||0})))}catch(e){}}
function ftdV(){setTimeout(ftdRun,0);
 return'<h1>FTD Calculator</h1><div class="card"><div class="row"><label>Deposit (ETB)</label><input id="fp" type="number" value="1000000" oninput="ftdRun()"><label>Term (months)</label><input id="fn" type="number" value="12" min="1" style="width:90px" oninput="ftdRun()"></div><div class="row"><label>Interest rate</label><select id="fo" onchange="ftdRun()"><option value="24">24% per year</option><option value="18">18% per year</option><option value="15">15% per year</option></select><label>Interest payment</label><select id="fm" onchange="ftdRun()"><option value="end">Paid at the end</option><option value="monthly">Paid monthly</option></select></div></div><div id="ftdout"></div>'}
function ftdRun(){if(!g('ftdout'))return;var P=+g('fp').value||0,n=Math.max(1,Math.round(+g('fn').value||1)),rate=+g('fo').value||0,mode=g('fm').value,c=ftdCalc(P,rate,n,mode);
 var h='<div class="card g"><div class="k"><span>Principal</span><b>'+f(P)+'</b></div><div class="k"><span>Monthly gross interest ('+rate+'%)</span><b>'+f(c.gross)+'</b></div><div class="k"><span>Monthly net interest (after 10% tax)</span><b>'+f(c.net)+'</b></div><div class="k"><span>Total net fixed interest</span><b>'+f(c.fix)+'</b></div>'
 +(mode=='end'?'<div class="k"><span>Interest-on-interest (net of tax)</span><b>'+f(c.ioi)+'</b></div>':'')
 +'<div class="k"><span>Total net interest</span><b>'+f(c.totI)+'</b></div><div class="k"><span>'+(mode=='end'?'Total maturity amount':'Principal returned at maturity')+'</span><b>'+f(c.mat)+'</b></div></div>'
 +(mode=='monthly'?'<p class="mu">Interest is paid out every month, so nothing is left to earn interest-on-interest.</p>':'')
 +'<div class="card sc"><table><tr><th>Month</th><th>Gross interest</th><th>Tax 10%</th><th>Net fixed interest</th><th>Interest-on-interest</th><th>Month total</th><th>'+(mode=='end'?'Accumulated':'Paid out so far')+'</th></tr>'
 +c.rows.map(function(x){return'<tr><td>'+x.m+'</td><td>'+f(x.gross)+'</td><td>'+f(x.tax)+'</td><td>'+f(x.net)+'</td><td>'+f(x.ioi)+'</td><td>'+f(x.tot)+'</td><td>'+f(x.cum)+'</td></tr>'}).join('')+'</table></div>';
 g('ftdout').innerHTML=h}

/* ---- Loan calculator: amortized, interest on remaining principal, due dates one month apart; penalty 0.2% per day when overdue ---- */
function lcCalc(P,rate,n,start){var r=rate/1200,pm=r?P*r/(1-Math.pow(1+r,-n)):P/n,bal=P,d=pd(start),ti=0,rows=[];
 for(var k=1;k<=n;k++){d=new Date(d);d.setMonth(d.getMonth()+1);var it=bal*r,pr=k==n?bal:pm-it;bal-=pr;ti+=it;rows.push({k:k,due:iso(d),pay:it+pr,pr:pr,it:it,bal:Math.max(0,bal)})}
 return{rows:rows,pm:pm,ti:ti,tot:P+ti}}
function lcRates(){try{var r=JSON.parse(localStorage.getItem('digaf_lc_rates')||'null');if(r&&r.length>=2)return[r[0],r[1],r[2]||22]}catch(e){}return[32,24,22]}
function lcSave(){try{localStorage.setItem('digaf_lc_rates',JSON.stringify([+g('lt0').value||0,+g('lt1').value||0,+g('lt2').value||0]))}catch(e){}}
/* Upfront charges deducted at disbursement (Digaf): collateral = service 10% + VAT 15% of service + stamp 1% + disaster 1%; salary = service 9% + insurance 5% + VAT 15% of service + disaster 1% + stamp 5 birr */
/* DIGAF Products fee table: 60/90/180/360 days = 2/3/6/12 months. Service charge: collateral 4/6/8/10%, personal guarantee (salary) 3/5/7/9%. Insurance (salary only) 2/3/4/5%. Disaster 1%, VAT 15% of service charge, stamp duty 1% (collateral) or 5 birr (salary). */
var SVC0={'0':{2:4,3:6,6:8,12:10},'1':{2:3,3:5,6:7,12:9},'2':{2:3,3:4,6:6,12:8}},INS0={2:2,3:3,6:4,12:5};

function upCharges(P,t,n){var sp=svcGet(t,n),ok=sp!==null&&sp!==undefined,sc=P*(ok?sp:0)/100,
 inp='<input type="number" step="0.01" value="'+(ok?sp:'')+'" placeholder="?" style="width:80px'+(ok?'':';border-color:var(--warn)')+'" onchange="svcSet(\''+t+'\','+n+',this.value)"> %',rows;
 if(t=='0')rows=[['Service charge',inp,sc],['VAT','15% of service charge',sc*0.15],['Stamp duty','1%',P*0.01],['Disaster charge','1%',P*0.01]];
 else rows=[['Service charge',inp,sc],['Insurance',INS0[n]+'%',P*INS0[n]/100],['VAT','15% of service charge',sc*0.15],['Disaster charge','1%',P*0.01],['Stamp duty','5 birr fixed',5]];
